<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GameCore Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://unpkg.com/modern-normalize/modern-normalize.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #090513;
      --bg-2: #130b2d;
      --surface: rgba(27, 18, 49, 0.75);
      --surface-strong: rgba(40, 25, 70, 0.92);
      --card: rgba(20, 14, 36, 0.85);
      --border: rgba(255,255,255,0.08);
      --text: #EEE9FF;
      --muted: #A7A0C1;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --radius: 16px;
      --shadow: 0 12px 32px rgba(0,0,0,.45), 0 4px 12px rgba(0,0,0,.28);
      --glass: blur(12px) saturate(125%);
      --transition: 220ms cubic-bezier(.2,.6,.2,1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1400px 800px at 0% -10%, #402b7d33 0%, transparent 55%),
        radial-gradient(1200px 700px at 110% 0%, #1e3d8f33 0%, transparent 60%),
        radial-gradient(900px 700px at 70% 120%, #6d28d933 0%, transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      min-height: 100vh;
    }

    .top-bar{
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 26px;
      background: linear-gradient(180deg, rgba(15,10,33,.9), rgba(15,10,33,.75));
      border-bottom: 1px solid var(--border);
      backdrop-filter: var(--glass);
      -webkit-backdrop-filter: var(--glass);
      box-shadow: 0 10px 26px rgba(0,0,0,.35);
    }

    .brand{
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.3px;
    }

    .brand img{
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.3));
    }

    nav a{
      position: relative;
      margin-left: 22px;
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      opacity: .85;
      transition: opacity var(--transition);
    }

    nav a::after{
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 0;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width var(--transition);
    }

    nav a:hover, nav a.active{
      opacity: 1;
    }

    nav a:hover::after, nav a.active::after{
      width: 100%;
    }

    main{
      max-width: 1200px;
      margin: 28px auto;
      padding: 0 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    section{
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: var(--glass);
      -webkit-backdrop-filter: var(--glass);
      padding: 24px 26px;
    }

    section header{
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1, h2{
      margin: 0;
      font-weight: 600;
    }

    h1{ font-size: 28px; }
    h2{ font-size: 22px; }

    .controls{
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .controls input[type="search"],
    .controls select{
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(23,15,40,0.85);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 15px;
      min-width: 220px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .controls input[type="search"]:focus,
    .controls select:focus{
      outline: none;
      border-color: rgba(139,92,246,.6);
      box-shadow: 0 0 0 4px rgba(139,92,246,.18);
    }

    .projects-grid{
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .project-card{
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      cursor: pointer;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
    }

    .project-card:hover{
      transform: translateY(-4px);
      border-color: rgba(139,92,246,0.5);
      box-shadow: 0 12px 24px rgba(139,92,246,0.18);
    }

    .project-name{
      font-weight: 600;
      font-size: 16px;
      line-height: 1.3;
    }

    .project-meta{
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .empty-state{
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .error{
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(220,38,38,0.15);
      border: 1px solid rgba(220,38,38,0.4);
      color: #fecaca;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    @media (max-width: 720px){
      .top-bar{
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      nav a{ margin-left: 0; margin-right: 16px; }
      main{ padding: 0 16px 40px; }
      section{ padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <img src="/images/logo.png" alt="GameCore logo">
      <span>GameCore</span>
    </div>
    <nav>
      <a href="/" >Home</a>
      <a href="/editor">Editor</a>
      <a href="/projects" class="active">Projects</a>
      <a href="/profile">Profile</a>
    </nav>
  </div>

  <main>
    <section id="user-section">
      <header>
        <div>
          <h1>Your Public Projects</h1>
          <p class="empty-state" id="user-info">These are the projects you've shared publicly.</p>
        </div>
      </header>
      <p class="empty-state" id="user-empty" hidden>No public projects yet. Toggle a project to public from the editor to showcase it here.</p>
      <div class="projects-grid" id="user-projects"></div>
    </section>

    <section>
      <header>
        <h2>Discover Projects</h2>
        <div class="controls">
          <input type="search" id="search" placeholder="Search projects..." autocomplete="off">
          <select id="filter">
            <option value="relevance">Filter by relevance</option>
            <option value="trending">Trending</option>
            <option value="likes">Most likes</option>
            <option value="favorites">Most favorites</option>
          </select>
        </div>
      </header>
      <div class="error" id="error-box"></div>
      <p class="empty-state" id="projects-empty" hidden>No projects found. Try a different search or filter.</p>
      <div class="projects-grid" id="projects-list"></div>
    </section>
  </main>

  <script>
    const userSection = document.getElementById('user-section');
    const userInfo = document.getElementById('user-info');
    const userEmpty = document.getElementById('user-empty');
    const userProjectsGrid = document.getElementById('user-projects');
    const projectsGrid = document.getElementById('projects-list');
    const projectsEmpty = document.getElementById('projects-empty');
    const errorBox = document.getElementById('error-box');
    const searchInput = document.getElementById('search');
    const filterSelect = document.getElementById('filter');

    let state = {
      search: '',
      filter: 'relevance',
      pending: false,
      debounce: null
    };

    function renderProjects(container, items) {
      container.innerHTML = '';
      for (const project of items) {
        const card = document.createElement('article');
        card.className = 'project-card';
        card.innerHTML = `
          <div class="project-name">${escapeHtml(project.name)}</div>
          <div class="project-meta">
            <span>❤ ${project.likes}</span>
            <span>★ ${project.favorites}</span>
          </div>
        `;
        card.addEventListener('click', () => {
          window.location.href = `/projects/${project.id}`;
        });
        container.appendChild(card);
      }
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[c] || c);
    }

    async function fetchProjects() {
      if (state.pending) return;
      state.pending = true;
      errorBox.style.display = 'none';

      const params = new URLSearchParams();
      if (state.search) params.set('search', state.search);
      if (state.filter) params.set('filter', state.filter);

      try {
        const res = await fetch(`/api/public-projects?${params.toString()}`);
        if (!res.ok) {
          throw new Error('Request failed');
        }
        const data = await res.json();

        if (data.filter) {
          filterSelect.value = data.filter;
          state.filter = data.filter;
        }

        if (!data.authenticated) {
          userSection.style.display = '';
          userProjectsGrid.innerHTML = '';
          userEmpty.textContent = 'Sign in to see your public projects.';
          userEmpty.hidden = false;
          userInfo.textContent = 'Sign in to explore and share your own public projects.';
        } else {
          userSection.style.display = '';
          userInfo.textContent = 'These are the projects you have shared publicly.';
          userEmpty.textContent = 'No public projects yet. Toggle a project to public from the editor to showcase it here.';
          if (data.userProjects && data.userProjects.length) {
            userEmpty.hidden = true;
            renderProjects(userProjectsGrid, data.userProjects);
          } else {
            userProjectsGrid.innerHTML = '';
            userEmpty.hidden = false;
          }
        }

        if (data.projects && data.projects.length) {
          projectsEmpty.hidden = true;
          renderProjects(projectsGrid, data.projects);
        } else {
          projectsGrid.innerHTML = '';
          projectsEmpty.hidden = false;
        }
      } catch (err) {
        errorBox.textContent = 'Could not load projects right now. Please try again later.';
        errorBox.style.display = 'block';
      } finally {
        state.pending = false;
      }
    }

    searchInput.addEventListener('input', (event) => {
      const value = event.target.value.trim();
      state.search = value;
      if (state.debounce) clearTimeout(state.debounce);
      state.debounce = setTimeout(fetchProjects, 300);
    });

    filterSelect.addEventListener('change', () => {
      state.filter = filterSelect.value;
      fetchProjects();
    });

    fetchProjects();
  </script>
</body>
</html>
