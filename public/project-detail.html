<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Details • GameCore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://unpkg.com/modern-normalize/modern-normalize.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #080512;
      --bg-2: #120b28;
      --surface: rgba(28, 19, 50, 0.8);
      --card: rgba(16, 11, 30, 0.85);
      --border: rgba(255,255,255,0.1);
      --text: #EEE9FF;
      --muted: #B6B0D4;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --radius: 18px;
      --shadow: 0 14px 32px rgba(0,0,0,.48), 0 6px 16px rgba(0,0,0,.28);
      --glass: blur(14px) saturate(130%);
      --transition: 220ms cubic-bezier(.2,.6,.2,1);
    }

    * { box-sizing: border-box; }

    body{
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1300px 800px at 0% -10%, #3c247233 0%, transparent 55%),
        radial-gradient(1100px 700px at 110% 0%, #1d3a8a33 0%, transparent 60%),
        radial-gradient(900px 700px at 70% 120%, #6d28d933 0%, transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar{
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 26px;
      background: linear-gradient(180deg, rgba(15,10,33,.9), rgba(15,10,33,.75));
      border-bottom: 1px solid var(--border);
      backdrop-filter: var(--glass);
      -webkit-backdrop-filter: var(--glass);
      box-shadow: 0 10px 26px rgba(0,0,0,.35);
    }

    .brand{
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 20px;
    }

    .brand img{
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.3));
    }

    nav a{
      position: relative;
      margin-left: 22px;
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      opacity: .85;
      transition: opacity var(--transition);
    }

    nav a::after{
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 0;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width var(--transition);
    }

    nav a:hover, nav a.active{ opacity: 1; }
    nav a:hover::after, nav a.active::after{ width: 100%; }

    main{
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 60px;
    }

    .panel{
      width: min(680px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: var(--glass);
      -webkit-backdrop-filter: var(--glass);
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    h1{
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.2;
    }

    .meta{
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      color: var(--muted);
      font-size: 15px;
    }

    .meta span{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 999px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .actions{
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    button, .btn{
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
    }

    .primary{
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0b0b16;
      box-shadow: 0 12px 24px rgba(139,92,246,0.28);
    }

    .primary:hover:not([disabled]){
      transform: translateY(-2px);
      box-shadow: 0 18px 30px rgba(139,92,246,0.36);
    }

    .secondary{
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.14);
    }

    .secondary:hover{
      transform: translateY(-2px);
    }

    button[disabled]{
      opacity: .6;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .status{
      font-size: 14px;
      color: var(--muted);
      min-height: 18px;
    }

    .status.error{ color: #fca5a5; }
    .status.success{ color: #4ade80; }

    .not-found{
      text-align: center;
      font-size: 20px;
      color: var(--muted);
    }

    @media (max-width: 720px){
      .top-bar{
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      main{ padding: 30px 16px 60px; }
      .panel{ padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <img src="/images/logo.png" alt="GameCore logo">
      <span>GameCore</span>
    </div>
    <nav>
      <a href="/">Home</a>
      <a href="/editor">Editor</a>
      <a href="/projects" class="active">Projects</a>
      <a href="/profile">Profile</a>
    </nav>
  </div>

  <main>
    <div class="panel" id="panel" hidden>
      <div>
        <h1 id="project-name">Loading...</h1>
        <div class="meta">
          <span id="owner"></span>
          <span id="likes"></span>
          <span id="favorites"></span>
        </div>
      </div>
      <div class="actions">
        <button class="secondary" id="back-btn">← Back to Projects</button>
        <button class="primary" id="play-btn">Play game</button>
        <button class="primary" id="copy-btn">Copy project</button>
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="panel not-found" id="not-found" hidden>
      Project not found or is no longer public.
    </div>
  </main>

  <script>
    const panel = document.getElementById('panel');
    const notFound = document.getElementById('not-found');
    const projectName = document.getElementById('project-name');
    const ownerEl = document.getElementById('owner');
    const likesEl = document.getElementById('likes');
    const favoritesEl = document.getElementById('favorites');
    const statusEl = document.getElementById('status');
    const playBtn = document.getElementById('play-btn');
    const copyBtn = document.getElementById('copy-btn');
    const backBtn = document.getElementById('back-btn');

    const projectId = window.location.pathname.split('/').filter(Boolean).pop();

    backBtn.addEventListener('click', () => {
      window.location.href = '/projects';
    });

    playBtn.addEventListener('click', () => {
      window.open(`/public-preview/${projectId}/`, '_blank', 'noopener');
    });

    async function copyProject() {
      statusEl.textContent = 'Copying project...';
      statusEl.className = 'status';
      copyBtn.disabled = true;
      try {
        const res = await fetch(`/api/public-projects/${projectId}/copy`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        if (res.status === 401) {
          statusEl.textContent = 'Please sign in to copy this project.';
          statusEl.className = 'status error';
          copyBtn.disabled = false;
          setTimeout(() => { window.location.href = '/login'; }, 1200);
          return;
        }
        if (!res.ok) {
          throw new Error('Copy failed');
        }
        const data = await res.json();
        statusEl.textContent = 'Project copied! Redirecting to the editor...';
        statusEl.className = 'status success';
        setTimeout(() => {
          window.location.href = (data && data.redirect) ? data.redirect : '/editor';
        }, 800);
      } catch (err) {
        statusEl.textContent = 'Something went wrong while copying. Please try again later.';
        statusEl.className = 'status error';
        copyBtn.disabled = false;
      }
    }

    copyBtn.addEventListener('click', copyProject);

    async function loadProject() {
      try {
        const res = await fetch(`/api/public-projects/${projectId}`);
        if (res.status === 404) {
          notFound.hidden = false;
          return;
        }
        if (!res.ok) {
          throw new Error('Failed to load');
        }
        const data = await res.json();
        const project = data.project;
        projectName.textContent = project.name;
        ownerEl.textContent = `👤 ${project.ownerName}`;
        likesEl.textContent = `❤ ${project.likes}`;
        favoritesEl.textContent = `★ ${project.favorites}`;
        panel.hidden = false;
        statusEl.textContent = '';
        if (!data.authenticated) {
          copyBtn.disabled = true;
          statusEl.textContent = 'Sign in to copy this project to your workspace.';
        }
        if (data.isOwner) {
          copyBtn.disabled = true;
          statusEl.textContent = 'This is your project. You can edit it directly in the editor.';
        }
      } catch (err) {
        notFound.hidden = false;
      }
    }

    loadProject();
  </script>
</body>
</html>
